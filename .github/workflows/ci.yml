name: Raft Chaos CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-chaos:
    name: Run Pytest & Byzantine Chaos Benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Invariant Tests
        run: |
          python -m pytest tests -v

      - name: Execute Byzantine Partition Experiment
        run: |
          python benchmarks/run_chaos_experiment.py

      - name: Upload Chaos Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raft-chaos-metrics-python-${{ matrix.python-version }}
          path: benchmarks/chaos_metrics.json
