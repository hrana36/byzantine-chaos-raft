[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byzantine-chaos-raft"
version = "1.0.0"
description = "Asymmetric Network Partition & Byzantine Fault-Injection Harness for Distributed Raft Consensus Engines"
readme = "README.md"
authors = [
    { name = "Md Habibur Rahaman Rana", email = "hrana36@gmail.com" }
]
license = { text = "MIT" }
keywords = ["distributed-systems", "raft-consensus", "chaos-engineering", "linearizability", "network-partition", "fault-injection", "split-brain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: System :: Distributed Computing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
"Homepage" = "https://github.com/hrana36/byzantine-chaos-raft"
"Bug Tracker" = "https://github.com/hrana36/byzantine-chaos-raft/issues"
